name: Build Blutter Binary

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart version (e.g. 3.3.4, 3.4.2, 3.5.2)'
        required: true
      upload_packages:
        description: 'Upload packages directory (Dart VM headers and static library)'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Blutter Binary
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Dart SDK cache
        id: cache-dartsdk
        uses: actions/cache@v4
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: Restore CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: Initialize CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: Clone Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: Generate CMake sources
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: Build Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: Build blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: Upload binary and packages
        uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ env.DART_VERSION }}
          path: |
            bin/
            ${{ inputs.upload_packages && 'packages/' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: blutter-${{ env.DART_VERSION }}
          path: .

      - name: Show build artifacts
        run: |
          echo "=== Binary files ==="
          ls -la bin/
          if [ "${{ inputs.upload_packages }}" == "true" ]; then
            echo "=== Packages structure ==="
            find packages -type f | head -20
          else
            echo "=== Packages not uploaded (upload_packages=false) ==="
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: |
            bin/*
            ${{ inputs.upload_packages && 'packages/*' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
