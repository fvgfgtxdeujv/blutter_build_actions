name: 构建 Blutter 二进制文件

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart 版本（如 3.3.4, 3.4.2, 3.5.2）'
        required: true
      upload_packages:
        description: '上传 packages 目录（Dart VM 头文件和静态库）'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 Blutter
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 Dart SDK 缓存
        id: cache-dartsdk
        uses: actions/cache@v5
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 移动到 bin 目录
        run: |
          mkdir -p release_upload
          mv bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64 release_upload/ 2>/dev/null || true

      - name: 复制 packages 目录 (可选)
        if: inputs.upload_packages == true
        run: |
          mv packages release_upload/ 2>/dev/null || true

      - name: 打包为 zip
        run: |
          cd release_upload
          zip -r ../blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip .
          cd ..
          echo "打包完成:"
          ls -lh *.zip

      - name: 上传 release 包
        uses: actions/upload-artifact@v5
        with:
          name: blutter_dartvm${{ env.DART_VERSION }}_android_arm64
          path: blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip
          overwrite: true

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - name: 下载 artifacts
        uses: actions/download-artifact@v5
        with:
          name: blutter_dartvm${{ env.DART_VERSION }}_android_arm64
          path: .

      - name: 解压并显示
        run: |
          mkdir -p release_contents
          unzip -o blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip -d release_contents/
          echo "=== 解压后的文件结构 ==="
          find release_contents -type f | head -20
          echo "=== 文件大小 ==="
          du -sh release_contents

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
