name: 构建 Blutter（单版本）

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart 版本（单个，如 3.3.4）'
        required: true
      compile_env:
        description: '编译环境（Windows / Ubuntu 22.04 / 24.04）'
        type: choice
        required: true
        default: '22.04'
        options:
          - 'windows'
          - '22.04'
          - '24.04'
      upload_packages:
        description: '上传 packages 目录（Dart VM 头文件和静态库）'
        type: boolean
        default: false
        required: false
      upload_release:
        description: '上传到 GitHub Release（关闭则仅上传 Artifacts）'
        type: boolean
        default: false
        required: false
      upload_dlls:
        description: '同时上传 Windows 运行依赖 dll 包（capstone + ICU，仅 Windows 生效）'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build-linux:
    name: 构建并发布（Linux）
    if: inputs.compile_env != 'windows'
    runs-on: ubuntu-${{ inputs.compile_env }}-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 Dart SDK 缓存
        id: cache-dartsdk
        uses: actions/cache@v5
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ inputs.compile_env }}" = "22.04" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        run: |
          mkdir -p bin
          mv bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64 . 2>/dev/null || true
          mv blutter_dartvm${{ env.DART_VERSION }}_android_arm64 bin/

          zip -r blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip bin packages

          echo "打包完成:"
          unzip -l blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip

      - name: 上传单个二进制 (不打包)
        if: inputs.upload_packages == false
        run: |
          mv bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64 . 2>/dev/null || true

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter 构建产物 ${{ env.DART_VERSION }}（Android ARM64）
          path: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
          if-no-files-found: error

  build-windows:
    name: 构建 Blutter Windows x64
    if: inputs.compile_env == 'windows'
    runs-on: windows-latest
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 配置 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装构建依赖
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q ninja pyelftools requests
          $scriptsDir = Join-Path (Split-Path (python -c "import sys;print(sys.executable)")) "Scripts"
          Write-Host "Ninja dir: $scriptsDir"
          "$scriptsDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          ninja --version

      - name: 准备 Windows 第三方库（ICU + capstone）
        run: python scripts/init_env_win.py

      - name: 克隆 Dart SDK
        run: python scripts/build.py clone-dart ${{ env.DART_VERSION }}

      - name: 生成 CMake 源文件
        run: python scripts/build.py generate-sources ${{ env.DART_VERSION }}

      - name: 构建 Dart VM
        run: python scripts/build.py build-dartvm ${{ env.DART_VERSION }} --arch aarch64

      - name: 构建 blutter
        run: python scripts/build.py build-blutter ${{ env.DART_VERSION }} --arch aarch64

      - name: 重命名产物为 _win 命名（直接上传 exe，运行时 dll 由 blutter.py 从仓库 build/ 目录下载）
        shell: pwsh
        run: |
          Rename-Item -Path "bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64.exe" -NewName "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win.exe"
          Get-ChildItem bin | ForEach-Object { Write-Host $_.Name }

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        shell: pwsh
        run: |
          Compress-Archive -Path "bin","packages" -DestinationPath "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win.zip" -Force
          Write-Host "打包完成:"
          Get-ChildItem "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win.zip" | ForEach-Object { Write-Host $_.Name }

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*_win.zip' || 'bin/blutter_dartvm*_win.exe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 ${{ env.DART_VERSION }}
          path: ${{ inputs.upload_packages && 'blutter_dartvm*_win.zip' || 'bin/blutter_dartvm*_win.exe' }}
          if-no-files-found: error

      - name: 打包 Windows 运行依赖 dll（可选）
        if: inputs.upload_dlls == true
        shell: pwsh
        run: |
          Compress-Archive -Path "bin/capstone.dll","bin/icuuc73.dll","bin/icudt73.dll" -DestinationPath "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win_dlls.zip"

      - name: 上传 dll 包
        if: inputs.upload_dlls == true
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 dlls ${{ env.DART_VERSION }}
          path: blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win_dlls.zip
          if-no-files-found: error
