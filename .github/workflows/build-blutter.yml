name: 构建 Blutter 二进制文件

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart 版本（如 3.3.4, 3.4.2, 3.5.2）'
        required: true
      upload_packages:
        description: '上传 packages 目录（Dart VM 头文件和静态库）'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 Dart SDK 缓存
        id: cache-dartsdk
        uses: actions/cache@v5
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        run: |
          mkdir -p release_upload
          mv bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64 release_upload/bin/ 2>/dev/null || true
          mv packages release_upload/ 2>/dev/null || true
          cd release_upload
          zip -r ../blutter_dartvm${{ env.DART_VERSION }}_android_arm64.zip .
          cd ..

      - name: 上传单个二进制 (不打包)
        if: inputs.upload_packages == false
        run: |
          mv bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64 . 2>/dev/null || true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
