name: Build Blutter Binary

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart version (e.g. 3.3.4, 3.4.2, 3.5.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        include:
          - arch: aarch64
            suffix: android_arm64
          - arch: x86_64
            suffix: linux_x64
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Dart SDK cache
        id: cache-dartsdk
        uses: actions/cache@v4
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: Restore CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}-${{ matrix.arch }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: Install aarch64 cross-compiler sysroot
        if: matrix.arch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee -a /etc/apt/sources.list.d/ubuntu.sources <<'EOF'

          Types: deb
          URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libcapstone-dev:arm64

      - name: Setup ICU for aarch64
        if: matrix.arch == 'aarch64'
        run: python3 scripts/build.py setup-icu

      - name: Generate CMake toolchain
        if: matrix.arch == 'aarch64'
        run: python3 scripts/build.py generate-toolchain

      - name: Initialize CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: Clone Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: Generate CMake sources
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: Build Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch "${{ matrix.arch }}"

      - name: Build blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch "${{ matrix.arch }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ env.DART_VERSION }}-${{ matrix.arch }}
          path: bin/blutter_dartvm${{ env.DART_VERSION }}_${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blutter-${{ env.DART_VERSION }}-*
          path: bin/

      - name: Flatten artifact directories
        run: |
          find bin -type f | while read f; do
            mv "$f" bin/
          done
          find bin -type d -empty -delete
          ls -la bin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
