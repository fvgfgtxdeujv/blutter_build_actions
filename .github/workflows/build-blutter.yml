name: 构建 Blutter（单版本）

run-name: 构建 Blutter ${{ inputs.dart_version }}（${{ inputs.build_target }}）

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart 版本（单个，如 3.3.4）'
        required: true
      build_target:
        description: '构建目标'
        type: choice
        required: true
        default: 'ubuntu_22'
        options:
          - 'windows_android'
          - 'windows_windows'
          - 'ubuntu_22'
          - 'ubuntu_24'
          - 'ubuntu_22_windows'
          - 'ubuntu_24_windows'
      upload_packages:
        description: '上传 packages 目录（Dart VM 头文件和静态库）'
        type: boolean
        default: false
        required: false
      upload_release:
        description: '上传到 GitHub Release（关闭则仅上传 Artifacts）'
        type: boolean
        default: false
        required: false
      upload_dlls:
        description: '同时上传 Windows 运行依赖 dll 包（capstone + ICU，仅 Windows 解析安卓生效）'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build-linux:
    name: 构建并发布（解析安卓 Linux）
    if: inputs.build_target == 'ubuntu_22' || inputs.build_target == 'ubuntu_24'
    runs-on: ${{ (inputs.build_target == 'ubuntu_24' && 'ubuntu-24.04-arm') || 'ubuntu-22.04-arm' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
      RUNNER_SUFFIX: ${{ (inputs.build_target == 'ubuntu_24' && '24') || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 Dart SDK 缓存
        id: cache-dartsdk
        uses: actions/cache@v5
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ env.RUNNER_SUFFIX }}" = "22" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        run: |
          mv "bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64" "bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64_${{ env.RUNNER_SUFFIX }}"
          zip -r "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_${{ env.RUNNER_SUFFIX }}.zip" bin packages

          echo "打包完成:"
          unzip -l "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_${{ env.RUNNER_SUFFIX }}.zip"

      - name: 上传单个二进制 (不打包)
        if: inputs.upload_packages == false
        run: |
          mv "bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64" "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_${{ env.RUNNER_SUFFIX }}"

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter 构建产物 ${{ env.DART_VERSION }}（Android ARM64 ${{ env.RUNNER_SUFFIX }}）
          path: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
          if-no-files-found: error

  build-arm64-windows:
    name: 构建并发布（ARM64 解析 Windows）
    if: inputs.build_target == 'ubuntu_22_windows' || inputs.build_target == 'ubuntu_24_windows'
    runs-on: ${{ (inputs.build_target == 'ubuntu_24_windows' && 'ubuntu-24.04-arm') || 'ubuntu-22.04-arm' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
      RUNNER_SUFFIX: ${{ (inputs.build_target == 'ubuntu_24_windows' && '24') || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 Dart SDK 缓存
        id: cache-dartsdk
        uses: actions/cache@v5
        with:
          path: dartsdk/
          key: dartsdk-${{ env.DART_VERSION }}
          restore-keys: dartsdk-${{ env.DART_VERSION }}_

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-${{ env.DART_VERSION }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ env.RUNNER_SUFFIX }}" = "22" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM（aarch64_windows：ARM 宿主编译 linux/arm64 非压缩，用于解析 Flutter Windows 桌面 app.so）
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64_windows

      - name: 构建 blutter（aarch64_windows）
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64_windows

      - name: 重命名产物为 windows_x64_<suffix> 命名
        run: |
          mv "bin/blutter_dartvm${{ env.DART_VERSION }}_linux_arm64" "bin/blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}"
          ls -la bin/

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        run: |
          mv "bin/blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}" "bin/blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}"
          zip -r "blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}.zip" bin packages

          echo "打包完成:"
          unzip -l "blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}.zip"

      - name: 上传单个二进制 (不打包)
        if: inputs.upload_packages == false
        run: |
          mv "bin/blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}" "blutter_dartvm${{ env.DART_VERSION }}_windows_x64_${{ env.RUNNER_SUFFIX }}"

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter 构建产物 ${{ env.DART_VERSION }}（Windows x64 ${{ env.RUNNER_SUFFIX }}）
          path: ${{ inputs.upload_packages && 'blutter_dartvm*.zip' || 'blutter_dartvm*' }}
          if-no-files-found: error

  build-windows-arm64:
    name: 构建并发布（Windows 解析安卓）
    if: inputs.build_target == 'windows_android'
    runs-on: windows-latest
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 准备 Windows 构建环境（MSVC / 依赖 / SDK）
        uses: ./.github/actions/prepare-windows
        with:
          dart_version: ${{ env.DART_VERSION }}

      - name: 构建 Dart VM (aarch64)
        run: python scripts/build.py build-dartvm ${{ env.DART_VERSION }} --arch aarch64

      - name: 构建 blutter (aarch64)
        run: python scripts/build.py build-blutter ${{ env.DART_VERSION }} --arch aarch64

      - name: 重命名产物为 _win 命名（直接上传 exe，运行时 dll 由 blutter.py 从仓库 build/ 目录下载）
        shell: pwsh
        run: |
          Rename-Item -Path "bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64.exe" -NewName "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win.exe"
          Get-ChildItem bin | ForEach-Object { Write-Host $_.Name }

      - name: 打包上传 packages (可选)
        if: inputs.upload_packages == true
        shell: pwsh
        run: |
          Compress-Archive -Path "bin","packages" -DestinationPath "blutter_dartvm${{ env.DART_VERSION }}_win.zip" -Force
          Write-Host "打包完成:"
          Get-ChildItem "blutter_dartvm${{ env.DART_VERSION }}_win.zip" | ForEach-Object { Write-Host $_.Name }

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: ${{ inputs.upload_packages && 'blutter_dartvm*_win.zip' || 'bin/blutter_dartvm*.exe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 ${{ env.DART_VERSION }}（Android ARM64）
          path: ${{ inputs.upload_packages && 'blutter_dartvm*_win.zip' || 'bin/blutter_dartvm*.exe' }}
          if-no-files-found: error

      - name: 打包 Windows 运行依赖 dll（可选）
        if: inputs.upload_dlls == true
        shell: pwsh
        run: |
          Compress-Archive -Path "bin/capstone.dll","bin/icuuc73.dll","bin/icudt73.dll" -DestinationPath "blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win_dlls.zip"

      - name: 上传 dll 包
        if: inputs.upload_dlls == true
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 dlls ${{ env.DART_VERSION }}
          path: blutter_dartvm${{ env.DART_VERSION }}_android_arm64_win_dlls.zip
          if-no-files-found: error

  build-windows-x64:
    name: 构建并发布（Windows 解析 Windows）
    if: inputs.build_target == 'windows_windows'
    runs-on: windows-latest
    env:
      DART_VERSION: ${{ inputs.dart_version || '3.3.4' }}
    steps:
      - uses: actions/checkout@v5

      - name: 准备 Windows 构建环境（MSVC / 依赖 / SDK）
        uses: ./.github/actions/prepare-windows
        with:
          dart_version: ${{ env.DART_VERSION }}

      - name: 构建 Dart VM（windows_x64，用于 Flutter Windows 桌面 app.so）
        run: python scripts/build.py build-dartvm ${{ env.DART_VERSION }} --arch windows_x64

      - name: 构建 blutter（windows_x64）
        run: python scripts/build.py build-blutter ${{ env.DART_VERSION }} --arch windows_x64

      - name: 重命名产物为 _win 命名
        shell: pwsh
        run: |
          Rename-Item -Path "bin/blutter_dartvm${{ env.DART_VERSION }}_windows_x64.exe" -NewName "blutter_dartvm${{ env.DART_VERSION }}_windows_x64_win.exe"
          Get-ChildItem bin | ForEach-Object { Write-Host $_.Name }

      - name: 创建 Release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: bin/blutter_dartvm*_windows_x64_win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        if: inputs.upload_release == false
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 ${{ env.DART_VERSION }}（Flutter Windows）
          path: bin/blutter_dartvm*_windows_x64_win.exe
          if-no-files-found: error
