name: 构建 Blutter（Windows 单版本测试）

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart 版本（单个，如 3.3.4）'
        required: true

permissions:
  contents: read

jobs:
  build-win:
    name: 构建 Blutter Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 配置 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装构建依赖
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q ninja pyelftools requests
          $scriptsDir = Join-Path (Split-Path (python -c "import sys;print(sys.executable)")) "Scripts"
          Write-Host "Ninja dir: $scriptsDir"
          "$scriptsDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          ninja --version

      - name: 准备 Windows 第三方库（ICU + capstone）
        run: python scripts/init_env_win.py

      - name: 克隆 Dart SDK
        run: python scripts/build.py clone-dart ${{ inputs.dart_version }}

      - name: 生成 CMake 源文件
        run: python scripts/build.py generate-sources ${{ inputs.dart_version }}

      - name: 构建 Dart VM
        run: python scripts/build.py build-dartvm ${{ inputs.dart_version }} --arch aarch64

      - name: 构建 blutter
        run: python scripts/build.py build-blutter ${{ inputs.dart_version }} --arch aarch64

      - name: 重命名产物为 _win 命名（直接上传 exe，运行时 dll 由 blutter.py 从仓库 build/ 目录下载）
        shell: pwsh
        run: |
          Rename-Item -Path "bin/blutter_dartvm${{ inputs.dart_version }}_android_arm64.exe" -NewName "blutter_dartvm${{ inputs.dart_version }}_android_arm64_win.exe"
          Get-ChildItem bin | ForEach-Object { Write-Host $_.Name }

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: Blutter Windows x64 ${{ inputs.dart_version }}
          path: bin/blutter_dartvm${{ inputs.dart_version }}_android_arm64_win.exe
          if-no-files-found: error
