name: 批量构建所有 Dart 版本

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-versions:
    name: 获取待构建版本
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: 计算待构建 Dart 版本
        id: list
        run: |
          # 获取所有 Dart SDK 版本 tag
          timeout 120 git ls-remote --tags https://github.com/dart-lang/sdk.git \
            | grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | uniq > /tmp/all_versions.txt

          # 过滤低于 2.15 的版本（blutter 不支持）
          awk -F. '$1 > 2 || ($1 == 2 && $2 >= 15)' /tmp/all_versions.txt > /tmp/filtered.txt

          # 获取仓库已有 Release 的 tag（用于排除已完成版本）
          gh release list --limit 1000 --json tagName -q '.[].tagName' > /tmp/existing.txt 2>/dev/null || true

          # 计算待构建版本（排除已发布的）
          sort /tmp/filtered.txt -o /tmp/filtered.txt
          sort /tmp/existing.txt -o /tmp/existing.txt
          comm -23 /tmp/filtered.txt /tmp/existing.txt > /tmp/todo.txt

          # 转为 JSON 数组
          VERSIONS=$(python3 -c "
import json
versions = [l.strip() for l in open('/tmp/todo.txt') if l.strip()]
print(json.dumps(versions))
")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "待构建版本数: $(echo "$VERSIONS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"

  build:
    name: 构建 Dart ${{ matrix.version }}
    needs: get-versions
    if: needs.get-versions.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}
    runs-on: ubuntu-24.04-arm
    env:
      DART_VERSION: ${{ matrix.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
