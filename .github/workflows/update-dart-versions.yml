name: 获取待构建 Dart 版本

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: 获取待构建版本列表
    runs-on: ubuntu-24.04
    steps:
      - name: 计算待构建 Dart 版本
        id: list
        run: |
          # 获取所有 Dart SDK 版本 tag
          timeout 120 git ls-remote --tags https://github.com/dart-lang/sdk.git \
            | grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | uniq > /tmp/all_versions.txt

          # 过滤低于 2.15 的版本（blutter 不支持）
          awk -F. '$1 > 2 || ($1 == 2 && $2 >= 15)' /tmp/all_versions.txt > /tmp/filtered.txt

          # 获取仓库已有 Release 的 tag（GitHub API 分页拉取全部，不依赖 gh CLI；
          # 避免 gh 失败被 2>/dev/null || true 吞掉后 existing.txt 为空导致无法排除）
          page=1
          : > /tmp/existing.txt
          while :; do
            RESP=$(curl -s -m 60 -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
            if ! echo "$RESP" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "错误：GitHub API 响应异常，无法获取 Release 列表：" >&2
              echo "$RESP" | jq -r '.message // .' >&2
              exit 1
            fi
            COUNT=$(echo "$RESP" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            echo "$RESP" | jq -r '.[].tag_name' >> /tmp/existing.txt
            page=$((page + 1))
          done
          echo "已有 Release 数: $(wc -l < /tmp/existing.txt)"

          # 计算待构建版本（排除已发布的）；sort -V 按版本号而非字典序排序，
          # 保证输出形如 3.2.0 → 3.10.0 → 3.13.0 的正确升序
          sort -V /tmp/filtered.txt -o /tmp/filtered.txt
          sort -V /tmp/existing.txt -o /tmp/existing.txt
          comm -23 /tmp/filtered.txt /tmp/existing.txt > /tmp/todo.txt

          # 转为 JSON 数组
          VERSIONS=$(python3 -c "import json; versions = [l.strip() for l in open('/tmp/todo.txt') if l.strip()]; print(json.dumps(versions))")
          echo "$VERSIONS" > /tmp/versions.json
          echo "待构建版本数: $(echo "$VERSIONS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: 输出待构建版本列表
        run: |
          echo "请在「批量构建 Blutter」workflow 中手动输入以下版本列表："
          echo
          echo '${{ steps.list.outputs.versions }}'
