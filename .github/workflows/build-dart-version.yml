name: 批量构建 Blutter

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Dart 版本列表，逗号分隔（如 3.3.4, 3.4.2, 3.5.2 或 [3.3.4, 3.4.2]）；超过 20 个版本时自动分片并行'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: 准备版本列表
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.prepare.outputs.versions }}
      workers: ${{ steps.prepare.outputs.workers }}
    steps:
      - name: 解析版本列表并计算 worker 数
        id: prepare
        env:
          INPUT_VERSIONS: ${{ inputs.dart_versions }}
        run: |
          # 支持 "[3.3.4, 3.4.2]" 或 "3.3.4, 3.4.2" 格式
          VERSIONS=$(echo "$INPUT_VERSIONS" | python3 -c "import json,sys; raw=sys.stdin.read().strip().strip('[]'); vs=[v.strip() for v in raw.split(',') if v.strip()]; print(json.dumps(vs))")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          # 版本数超过 20 时固定 20 个 worker 分片并行，否则每版本一个 worker
          echo "workers=$(python3 -c "import json; vs=json.loads('$VERSIONS'); print(json.dumps(list(range(1, min(20, len(vs)) + 1))))")" >> $GITHUB_OUTPUT
          echo "待构建版本: $VERSIONS"

  build:
    name: 构建 Worker ${{ matrix.worker }}
    needs: prepare
    if: needs.prepare.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-build
          restore-keys: ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 计算本 worker 的版本分片
        id: shard
        env:
          ALL_VERSIONS: ${{ needs.prepare.outputs.versions }}
          WORKER_LIST: ${{ needs.prepare.outputs.workers }}
        run: |
          SUBSET=$(python3 -c "import json,os; versions=json.loads(os.environ['ALL_VERSIONS']); workers=json.loads(os.environ['WORKER_LIST']); idx=${{ matrix.worker }}-1; n=len(workers); print(' '.join(versions[idx::n]))")
          echo "本 worker 负责版本: $SUBSET"
          echo "subset=$SUBSET" >> $GITHUB_OUTPUT

      - name: 构建并发布分片版本
        run: |
          for ver in ${{ steps.shard.outputs.subset }}; do
            echo "===== 开始构建 Dart $ver ====="
            if python3 scripts/build.py clone-dart "$ver" && \
               python3 scripts/build.py generate-sources "$ver" && \
               python3 scripts/build.py build-dartvm "$ver" --arch aarch64 && \
               python3 scripts/build.py build-blutter "$ver" --arch aarch64; then
              echo "===== 发布 $ver ====="
              gh release create "$ver" "bin/blutter_dartvm${ver}_android_arm64" --title "blutter $ver" 2>&1 || echo "Release 创建失败（可能已存在）: $ver"
            else
              echo "===== 构建失败，跳过: $ver ====="
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
