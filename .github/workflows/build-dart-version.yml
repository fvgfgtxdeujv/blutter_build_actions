name: 批量构建 Blutter

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Dart 版本列表，逗号分隔或 JSON 数组（如 3.3.4, 3.4.2 或 [3.3.4, 3.4.2]）；分割成最多 20 个 worker 并行构建'
        required: true
      runner_version:
        description: '编译环境（Ubuntu 版本，22.04 与手机 Droidspaces 环境一致）'
        type: choice
        required: true
        default: '22.04'
        options:
          - '22.04'
          - '24.04'

permissions:
  contents: write

jobs:
  prepare:
    name: 解析版本列表
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.prepare.outputs.versions }}
      subsets: ${{ steps.prepare.outputs.subsets }}
      workers: ${{ steps.prepare.outputs.workers }}
    steps:
      - name: 安装依赖（主 worker 预检）
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "$RUNNER_VERSION" = "22.04" ]; then
            echo "==> 预检：安装 gcc-13 / g++-13（PPA）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
          fi
          gcc --version | head -1

      - name: 解析版本列表并按已有产物过滤
        id: prepare
        env:
          INPUT_VERSIONS: ${{ inputs.dart_versions }}
          RUNNER_VERSION: ${{ inputs.runner_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 支持 "[3.3.4, 3.4.2]" 或 "3.3.4, 3.4.2" 格式
          VERSIONS=$(echo "$INPUT_VERSIONS" | python3 -c "import json,sys; raw=sys.stdin.read().strip().strip('[]'); vs=[v.strip() for v in raw.split(',') if v.strip()]; print(json.dumps(vs))")
          if [ "$RUNNER_VERSION" = "22.04" ]; then SUFFIX="22"; else SUFFIX="24"; fi
          echo "编译环境: $RUNNER_VERSION (后缀 _$SUFFIX)"
          mapfile -t ALL < <(echo "$VERSIONS" | python3 -c "import json,sys; print('\n'.join(json.loads(sys.stdin.read())))")
          # 主 worker 先检查每个版本：本环境产物已存在则从编译列表排除
          FILTERED=()
          for ver in "${ALL[@]}"; do
            asset="blutter_dartvm${ver}_android_arm64_${SUFFIX}"
            if gh release view "$ver" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
              echo "排除（已有 $asset）: $ver"
            else
              FILTERED+=("$ver")
            fi
          done
          # 主 worker：先判断版本数，大于 20 个按 20 分割，否则每版本一个 worker；版本按数字升序均匀连续分块
          PLAN=$(python3 -c "import json,sys; vs=sys.argv[1:]; vs.sort(key=lambda v: tuple(int(x) for x in v.split('.'))); n=len(vs); n=20 if n>20 else n; base=len(vs)//n; rem=len(vs)%n; ss=[vs[i*base+min(i,rem):(i+1)*base+min(i+1,rem)] for i in range(n)]; print(json.dumps({'versions': vs, 'subsets': ss, 'workers': list(range(1,n+1))}))" "${FILTERED[@]}")
          VERSIONS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['versions']))")
          SUBSETS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['subsets']))")
          WORKERS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['workers']))")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "subsets=$SUBSETS" >> $GITHUB_OUTPUT
          echo "workers=$WORKERS" >> $GITHUB_OUTPUT
          echo "过滤并排序后待构建版本: $VERSIONS"

  build:
    name: 构建 Worker ${{ matrix.worker }}（Ubuntu ${{ inputs.runner_version }}）
    needs: prepare
    if: needs.prepare.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    runs-on: ubuntu-${{ inputs.runner_version }}-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      RUNNER_SUFFIX: ${{ (inputs.runner_version == '22.04' && '22') || '24' }}
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.runner_version }}-worker-${{ matrix.worker }}
          restore-keys: ccache-${{ inputs.runner_version }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ inputs.runner_version }}" = "22.04" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 获取本 worker 的版本分片
        id: shard
        env:
          SUBSETS_JSON: ${{ needs.prepare.outputs.subsets }}
        run: |
          SUBSET=$(python3 -c "import json; print(' '.join(json.loads('$SUBSETS_JSON')[${{ matrix.worker }}-1]))")
          echo "本 worker 负责版本: $SUBSET"
          echo "subset=$SUBSET" >> $GITHUB_OUTPUT

      - name: 构建并发布分片版本（缺失的才构建）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ver in ${{ steps.shard.outputs.subset }}; do
            asset="blutter_dartvm${ver}_android_arm64_${RUNNER_SUFFIX}"
            echo "===== 开始构建 Dart $ver ($asset) ====="
            if python3 scripts/build.py clone-dart "$ver" \
               && python3 scripts/build.py generate-sources "$ver" \
               && python3 scripts/build.py build-dartvm "$ver" --arch aarch64 \
               && python3 scripts/build.py build-blutter "$ver" --arch aarch64; then
              bin_file="bin/$asset"
              mv "bin/blutter_dartvm${ver}_android_arm64" "$bin_file"
              echo "===== 发布 $ver ($bin_file) ====="
              if gh release create "$ver" "$bin_file" --title "blutter $ver" 2>/dev/null; then
                echo "Release 已创建并上传: $bin_file"
              else
                for i in 1 2 3 4 5; do
                  if gh release upload "$ver" "$bin_file" --clobber 2>/dev/null; then
                    echo "已追加上传到已存在的 Release: $bin_file"
                    break
                  fi
                  echo "Release 尚未就绪，等待后重试 ($i/5)"
                  sleep 8
                done
              fi
              echo "===== $ver 完成 ====="
            else
              echo "===== 构建失败，跳过: $ver ====="
            fi
          done
