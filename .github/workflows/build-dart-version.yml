name: 批量构建 Blutter

on:
  repository_dispatch:
    types: [build-dart]
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Dart 版本列表，逗号分隔（如 3.3.4, 3.4.2, 3.5.2 或 [3.3.4, 3.4.2]）'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: 准备版本列表
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.prepare.outputs.versions }}
    steps:
      - name: 解析版本列表
        id: prepare
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # 从 update workflow 的 client_payload 获取版本列表
            VERSIONS='${{ toJson(github.event.client_payload.versions) }}'
          else
            # 手动触发：支持 "[3.3.4, 3.4.2]" 或 "3.3.4, 3.4.2" 格式
            VERSIONS=$(echo "${{ inputs.dart_versions }}" | python3 -c "import json,sys; raw=sys.stdin.read().strip().strip('[]'); vs=[v.strip() for v in raw.split(',') if v.strip()]; print(json.dumps(vs))")
          fi
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "待构建版本: $VERSIONS"

  build:
    name: 构建 Dart ${{ matrix.version }}
    needs: prepare
    if: needs.prepare.outputs.versions != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    runs-on: ubuntu-24.04-arm
    env:
      DART_VERSION: ${{ matrix.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
    steps:
      - uses: actions/checkout@v5

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DART_VERSION }}
          restore-keys: ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip wget \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev ccache clang llvm

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 克隆 Dart SDK
        run: python3 scripts/build.py clone-dart "${{ env.DART_VERSION }}"

      - name: 生成 CMake 源文件
        run: python3 scripts/build.py generate-sources "${{ env.DART_VERSION }}"

      - name: 构建 Dart VM
        run: python3 scripts/build.py build-dartvm "${{ env.DART_VERSION }}" --arch aarch64

      - name: 构建 blutter
        run: python3 scripts/build.py build-blutter "${{ env.DART_VERSION }}" --arch aarch64

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DART_VERSION }}
          name: blutter ${{ env.DART_VERSION }}
          files: bin/blutter_dartvm${{ env.DART_VERSION }}_android_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
