name: 批量构建 Blutter

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Dart 版本列表，逗号分隔（如 3.3.4, 3.4.2, 3.5.2 或 [3.3.4, 3.4.2]）；按版本号顺序逐个构建发布'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布（Ubuntu ${{ matrix.runner_version }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_version: '22.04'
            suffix: '22'
          - runner_version: '24.04'
            suffix: '24'
    runs-on: ubuntu-${{ matrix.runner_version }}-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
    steps:
      - uses: actions/checkout@v5

      - name: 解析并排序版本列表
        id: prepare
        env:
          INPUT_VERSIONS: ${{ inputs.dart_versions }}
        run: |
          # 支持 "[3.3.4, 3.4.2]" 或 "3.3.4, 3.4.2" 格式，并按版本号排序
          VERSIONS=$(echo "$INPUT_VERSIONS" | python3 -c "import json,sys; raw=sys.stdin.read().strip().strip('[]'); vs=[v.strip() for v in raw.split(',') if v.strip()]; vs.sort(key=lambda v: tuple(int(x) for x in v.split('.'))); print(json.dumps(vs))")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "按版本号排序后的构建顺序: $VERSIONS"

      - name: 恢复 CCache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-build
          restore-keys: ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ matrix.runner_version }}" = "22.04" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 按版本号顺序构建并发布（产物带 _${{ matrix.suffix }} 后缀）
        env:
          VERSIONS: ${{ steps.prepare.outputs.versions }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_SUFFIX: ${{ matrix.suffix }}
        run: |
          python3 -c "import json,os; print('\n'.join(json.loads(os.environ['VERSIONS'])))" > /tmp/versions.txt
          while IFS= read -r ver; do
            echo "===== 开始构建 Dart $ver ====="
            if python3 scripts/build.py clone-dart "$ver" \
               && python3 scripts/build.py generate-sources "$ver" \
               && python3 scripts/build.py build-dartvm "$ver" --arch aarch64 \
               && python3 scripts/build.py build-blutter "$ver" --arch aarch64; then
              # 重命名产物，带上环境后缀（_22 / _24）
              bin_file="bin/blutter_dartvm${ver}_android_arm64_${RUNNER_SUFFIX}"
              mv "bin/blutter_dartvm${ver}_android_arm64" "$bin_file"
              echo "===== 发布 $ver ($bin_file) ====="
              # 22/24 两个 job 并行，同一 tag：先创建者成功，后到者追加上传
              if gh release create "$ver" "$bin_file" --title "blutter $ver" 2>/dev/null; then
                echo "Release 已创建并上传: $bin_file"
              else
                for i in 1 2 3 4 5; do
                  if gh release upload "$ver" "$bin_file" --clobber 2>/dev/null; then
                    echo "已追加上传到已存在的 Release: $bin_file"
                    break
                  fi
                  echo "Release 尚未就绪，等待后重试 ($i/5)"
                  sleep 8
                done
              fi
              echo "===== $ver 完成，开始下一个版本 ====="
            else
              echo "===== 构建失败，跳过: $ver ====="
            fi
          done < /tmp/versions.txt
          echo "===== 全部版本处理完毕 ====="
