name: 批量构建 Blutter 并同步到 Gitee

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Dart 版本列表，逗号分隔或 JSON 数组（如 3.3.4, 3.4.2 或 [3.3.4, 3.4.2]）；分割成最多 20 个 worker 并行构建'
        required: true
        type: string
      compile_env:
        description: '编译环境（Windows / Ubuntu 22.04 / 24.04）'
        type: choice
        required: true
        default: '22.04'
        options:
          - 'windows'
          - '22.04'
          - '24.04'

permissions:
  contents: write

jobs:
  prepare:
    name: 解析版本列表
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.prepare.outputs.versions }}
      subsets: ${{ steps.prepare.outputs.subsets }}
      workers: ${{ steps.prepare.outputs.workers }}
    steps:
      - name: 解析版本列表并按已有产物过滤
        id: prepare
        env:
          INPUT_VERSIONS: ${{ inputs.dart_versions }}
          COMPILE_ENV: ${{ inputs.compile_env }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 支持 "[3.3.4, 3.4.2]" 或 "3.3.4, 3.4.2" 格式
          VERSIONS=$(echo "$INPUT_VERSIONS" | python3 -c "import json,sys; raw=sys.stdin.read().strip().strip('[]'); vs=[v.strip() for v in raw.split(',') if v.strip()]; print(json.dumps(vs))")
          if [ "$COMPILE_ENV" = "windows" ]; then SUFFIX="win"; elif [ "$COMPILE_ENV" = "22.04" ]; then SUFFIX="22"; else SUFFIX="24"; fi
          echo "编译环境: $COMPILE_ENV (后缀 _$SUFFIX)"
          mapfile -t ALL < <(echo "$VERSIONS" | python3 -c "import json,sys; print('\n'.join(json.loads(sys.stdin.read())))")
          # 主 worker 先检查每个版本：本环境产物已存在则从编译列表排除
          FILTERED=()
          for ver in "${ALL[@]}"; do
            if [ "$COMPILE_ENV" = "windows" ]; then
              asset="blutter_dartvm${ver}_android_arm64_${SUFFIX}.exe"
            else
              asset="blutter_dartvm${ver}_android_arm64_${SUFFIX}"
            fi
            if gh release view "$ver" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
              echo "排除（已有 $asset）: $ver"
            else
              FILTERED+=("$ver")
            fi
          done
          # 主 worker：先判断版本数，大于 20 个按 20 分割，否则每版本一个 worker；版本按数字升序均匀连续分块
          PLAN=$(python3 -c "import json,sys; vs=sys.argv[1:]; vs.sort(key=lambda v: tuple(int(x) for x in v.split('.'))); n=len(vs); n=20 if n>20 else n; base=len(vs)//n; rem=len(vs)%n; ss=[vs[i*base+min(i,rem):(i+1)*base+min(i+1,rem)] for i in range(n)]; print(json.dumps({'versions': vs, 'subsets': ss, 'workers': list(range(1,n+1))}))" "${FILTERED[@]}")
          VERSIONS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['versions']))")
          SUBSETS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['subsets']))")
          WORKERS=$(echo "$PLAN" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['workers']))")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "subsets=$SUBSETS" >> $GITHUB_OUTPUT
          echo "workers=$WORKERS" >> $GITHUB_OUTPUT
          echo "过滤并排序后待构建版本: $VERSIONS"

  build:
    name: 构建 Worker ${{ matrix.worker }}（${{ inputs.compile_env }}）
    needs: prepare
    if: needs.prepare.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    runs-on: ${{ (inputs.compile_env == 'windows' && 'windows-latest') || format('ubuntu-{0}-arm', inputs.compile_env) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      RUNNER_SUFFIX: ${{ (inputs.compile_env == 'windows' && 'win') || (inputs.compile_env == '22.04' && '22') || '24' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_TARGET_REPO: qeruiop_admin/blutter_build_actions
    steps:
      - uses: actions/checkout@v5

      - name: 配置 MSVC x64 编译环境
        if: inputs.compile_env == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装构建依赖
        if: inputs.compile_env == 'windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q ninja pyelftools requests
          $scriptsDir = Join-Path (Split-Path (python -c "import sys;print(sys.executable)")) "Scripts"
          Write-Host "Ninja dir: $scriptsDir"
          "$scriptsDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          ninja --version

      - name: 恢复 CCache 缓存
        if: inputs.compile_env != 'windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.compile_env }}-worker-${{ matrix.worker }}
          restore-keys: ccache-${{ inputs.compile_env }}-

      - name: 安装依赖
        if: inputs.compile_env != 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            cmake ninja-build git curl unzip jq \
            python3 python3-pip python3-pyelftools python3-requests \
            libcapstone-dev libicu-dev ccache
          if [ "${{ inputs.compile_env }}" = "22.04" ]; then
            echo "==> Ubuntu 22.04: 安装 gcc-13 / g++-13（提供 libstdc++-13，支持 std::format）"
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gcc-13 g++-13
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          else
            echo "==> Ubuntu 24.04: 使用系统默认 gcc-13"
          fi
          gcc --version | head -1
          g++ --version | head -1

      - name: 初始化 CCache
        if: inputs.compile_env != 'windows'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: 获取本 worker 的版本分片
        id: shard
        env:
          SUBSETS_JSON: ${{ needs.prepare.outputs.subsets }}
        run: |
          SUBSET=$(python3 -c "import json; print(' '.join(json.loads('$SUBSETS_JSON')[${{ matrix.worker }}-1]))")
          echo "本 worker 负责版本: $SUBSET"
          echo "subset=$SUBSET" >> $GITHUB_OUTPUT

      - name: 构建并发布分片版本（构建与 Gitee 上传流水线重叠）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 后台同步单个版本到 Gitee（tag + release + 附件），附件直接用本地产物
          sync_to_gitee() {
            local ver="$1"
            local bin_file="$2"
            local fname
            fname=$(basename "$bin_file")
            echo "===== [Gitee] 开始后台同步 $ver ($fname) ====="

            # 1. 创建 tag（幂等）
            if ! curl -s -m 30 -H "Authorization: token $GITEE_TOKEN" \
                "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/tags?per_page=100&page=1" \
                | jq -e --arg t "$ver" '.[] | select(.name==$t)' > /dev/null 2>&1; then
              curl -s -m 30 -X POST -H "Authorization: token $GITEE_TOKEN" -H "Content-Type: application/json" \
                -d "{\"refs\":\"master\",\"tag_name\":\"$ver\",\"tag_message\":\"blutter $ver\"}" \
                "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/tags" > /dev/null 2>&1 \
                && echo "✅ [Gitee] tag $ver 已创建" || echo "⚠️ [Gitee] tag $ver 创建失败"
            else
              echo "[Gitee] tag $ver 已存在，跳过"
            fi

            # 2. 检查 / 创建 Release（幂等）
            local release_id
            release_id=$(curl -s -m 30 -H "Authorization: token $GITEE_TOKEN" \
              "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/releases/tags/$ver" | jq -r '.id // "null"' 2>/dev/null)
            if [ "$release_id" = "null" ]; then
              local create_resp
              create_resp=$(curl -s -m 60 -X POST -H "Authorization: token $GITEE_TOKEN" -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"$ver\",\"name\":\"blutter $ver\",\"body\":\"blutter $ver\",\"prerelease\":false,\"target_commitish\":\"master\"}" \
                "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/releases")
              release_id=$(echo "$create_resp" | jq -r '.id // "null"' 2>/dev/null)
            else
              echo "[Gitee] Release $ver 已存在 (ID: $release_id)"
            fi
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "❌ [Gitee] $ver Release 创建失败"
              return 1
            fi

            # 3. 上传附件（本地文件，先查重，带超时和重试）
            if curl -s -m 30 -H "Authorization: token $GITEE_TOKEN" \
                "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/releases/$release_id/attach_files" \
                | jq -e --arg n "$fname" '.[] | select(.name==$n)' > /dev/null 2>&1; then
              echo "✅ [Gitee] 附件 $fname 已存在，跳过上传"
              return 0
            fi
            echo "⬆️ [Gitee] 上传 $fname 到 Release $ver (ID: $release_id)"
            for i in 1 2 3; do
              if curl -s -m 600 --connect-timeout 10 -X POST -H "Authorization: token $GITEE_TOKEN" \
                  -F "file=@$bin_file" \
                  "https://gitee.com/api/v5/repos/$GITEE_TARGET_REPO/releases/$release_id/attach_files" \
                  | jq -e '.name' > /dev/null 2>&1; then
                echo "✅ [Gitee] $ver 附件上传完成"
                return 0
              fi
              echo "⚠️ [Gitee] $ver 附件上传失败，重试 ($i/3)"
              sleep 5
            done
            echo "❌ [Gitee] $ver 附件上传失败"
            return 1
          }

          PLATFORM="${{ inputs.compile_env }}"
          GITEE_PIDS=()

          # Windows 依赖（ICU + capstone）仅准备一次，后续版本复用
          if [ "$PLATFORM" = "windows" ]; then
            echo "===== 准备 Windows 第三方库（ICU + capstone）====="
            python scripts/init_env_win.py || exit 1
          fi

          for ver in ${{ steps.shard.outputs.subset }}; do
            asset="blutter_dartvm${ver}_android_arm64_${RUNNER_SUFFIX}"
            if [ "$PLATFORM" = "windows" ]; then asset="${asset}.exe"; fi
            echo "===== 开始构建 Dart $ver ($asset) ====="
            BUILD_OK=false
            if [ "$PLATFORM" = "windows" ]; then
              if python scripts/build.py clone-dart "$ver" \
                 && python scripts/build.py generate-sources "$ver" \
                 && python scripts/build.py build-dartvm "$ver" --arch aarch64 \
                 && python scripts/build.py build-blutter "$ver" --arch aarch64; then
                mv "bin/blutter_dartvm${ver}_android_arm64.exe" "bin/$asset"
                BUILD_OK=true
              fi
            else
              if python3 scripts/build.py clone-dart "$ver" \
                 && python3 scripts/build.py generate-sources "$ver" \
                 && python3 scripts/build.py build-dartvm "$ver" --arch aarch64 \
                 && python3 scripts/build.py build-blutter "$ver" --arch aarch64; then
                mv "bin/blutter_dartvm${ver}_android_arm64" "bin/$asset"
                BUILD_OK=true
              fi
            fi
            if [ "$BUILD_OK" = "true" ]; then
              bin_file="bin/$asset"
              echo "===== 发布 $ver ($bin_file) ====="
              if gh release create "$ver" "$bin_file" --title "blutter $ver" 2>/dev/null; then
                echo "Release 已创建并上传: $bin_file"
              else
                for i in 1 2 3 4 5; do
                  if gh release upload "$ver" "$bin_file" --clobber 2>/dev/null; then
                    echo "已追加上传到已存在的 Release: $bin_file"
                    break
                  fi
                  echo "Release 尚未就绪，等待后重试 ($i/5)"
                  sleep 8
                done
              fi
              echo "===== $ver 构建完成，后台同步到 Gitee，继续下一个 ====="
              sync_to_gitee "$ver" "$bin_file" &
              GITEE_PIDS+=($!)
            else
              echo "===== 构建失败，跳过: $ver ====="
            fi
          done
          # 等待所有后台 Gitee 同步完成
          echo "===== 全部版本构建完成，等待 Gitee 后台同步收尾 ====="
          for pid in "${GITEE_PIDS[@]}"; do
            wait "$pid" || echo "⚠️ 有 Gitee 同步子任务失败 (pid=$pid)"
          done
          echo "===== 全部构建与 Gitee 同步完成 ====="
